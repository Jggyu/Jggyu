name: 스네이크 갱신

on:
  schedule:
    # 매주 월요일 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2EA043&color_dots=#161B22,#1E4E2E,#238636,#2EA043,#57D96B
            dist/snake-light.svg?palette=github-light&color_snake=#1A7F37&color_dots=#EBEDF0,#BFE5CB,#8ED0A3,#57B87A,#1A7F37

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}