name: 프로필 갱신

on:
  schedule:
    # 매주 월요일 09:00 KST (일요일 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "profile.config.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SVG 생성
        env:
          # private 기여까지 넣으려면 read:user PAT를 secrets.CONTRIB_TOKEN 으로 등록
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/render-contrib.mjs
          node scripts/render-stats.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 프로필 그래픽 갱신"
            git push
          fi