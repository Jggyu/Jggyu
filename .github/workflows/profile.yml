name: 프로필 갱신

on:
  schedule:
    - cron: "0 0 * * 1"    # 매주 월요일 09:00 KST
  workflow_dispatch:
  push:
    paths:
      - "scripts/render-profile.mjs"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  # ① 이름 블록 + 목록 SVG — 한글 폰트를 서브셋해서 박아 넣는다
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          npm install pretendard --no-save
          pip install fonttools brotli

      - name: SVG 생성
        run: node scripts/render-profile.mjs

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 프로필 블록 갱신"
            git push
          fi

  # ② 스네이크 — output 브랜치로 나간다
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2EA043&color_dots=#161B22,#1E4E2E,#238636,#2EA043,#57D96B
            dist/snake-light.svg?palette=github-light&color_snake=#1A7F37&color_dots=#EBEDF0,#BFE5CB,#8ED0A3,#57B87A,#1A7F37

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}